services:
  postgres:
    image: postgres:17
    container_name: transcendence-postgres
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: transcendence_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: