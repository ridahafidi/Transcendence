services:
  nginx:
    image: nginx:stable-alpine3.24-slim
    ports: [ "8080:80" ]
    volumes: [ "./srcs/nginx/default.conf:/etc/nginx/conf.d/default.conf" ]
    depends_on:
      - backend

  frontend:
    build:
      context: srcs/
      dockerfile: frontend/Dockerfile
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    ports: [ "5173:5173" ]

  backend:
    build:
      context: srcs/
      dockerfile: backend/Dockerfile
    volumes:
      - ./srcs/backend:/app
      - /app/node_modules
    env_file: .env
    ports: [ "3000:3000" ]
    depends_on:
      db:
        condition: service_healthy

  db:
    build: srcs/db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
