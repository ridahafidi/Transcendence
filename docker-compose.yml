services:
  nginx:
    image: nginx:stable-alpine3.24-slim
    ports: [ "8080:80" ]
    volumes: [ "./srcs/nginx/default.conf:/etc/nginx/conf.d/default.conf" ]

  frontend:
    build: srcs/frontend
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    ports: [ "5173:5173" ]

  backend:
    build: srcs/backend

  db:
    build: srcs/db
