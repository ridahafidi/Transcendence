services:
  nginx:
    image: nginx:stable-alpine3.24-slim
    ports: [ "8080:80" ]
    volumes: [ "./srcs/nginx/default.conf:/etc/nginx/conf.d/default.conf" ]

  frontend:
    build: srcs/frontend
    command: tail -f /dev/null

  backend:
    build: srcs/backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    build: srcs/db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: