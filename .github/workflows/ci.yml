name: my-web-app
on:
  pull_request:
jobs:
  run_containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set-up containers
        run: make
      - name: check website availability
        run: curl -f --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080